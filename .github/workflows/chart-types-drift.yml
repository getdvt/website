name: Chart-type drift check

# Every dvtType string in src/data/charts.ts must resolve to a member of dvt's
# canonical PanelType enum, which is VENDORED into src/data/panel-types.json.
#
# The enum is vendored because getdvt/dvt is private and CI has no token to read
# it live. The vendored copy is refreshed locally via scripts/sync-panel-types.sh
# (which now defaults to gh api / origin/main — no sibling checkout required),
# then committed.
#
# Coverage split (mirrors spec-skill-drift.yml):
#   - PR trigger catches a hand-edit of charts.ts that introduces a typo or an
#     invented dvtType, and catches a stale panel-types.json after a manual refresh
#     that wasn't committed.
#   - UPSTREAM drift (a silent rename in getdvt/dvt while both local files sit
#     unchanged) is caught by the weekly `schedule:` sweep in the `upstream-sweep`
#     job below. That job mints a short-lived GitHub App installation token and
#     reads origin/main's schema live via `gh api`, then checks it TWICE: a
#     set-compare of $defs.PanelType.enum against panel-types.json, and a
#     byte-compare of the whole file against the vendored dashboard.schema.json,
#     after normalizing the upstream fetch with the same scripts/normalize-schema.mjs
#     the vendored copy was produced by (this repo is public; upstream annotation
#     prose is stripped, so a raw compare would report permanent false drift).
#     The second is what keeps the snippet gate honest — it validates against the
#     WHOLE schema, so a change to $defs/Panel or $defs/TableSpec (the class of
#     change that motivated the gate) would otherwise leave every job green while
#     the gate silently checked a stale contract. Auth = the `getdvt-ci-reader`
#     App (Contents: read on getdvt/dvt), wired as the `DVT_SCHEMA_APP_ID` repo
#     variable + `DVT_SCHEMA_APP_PRIVATE_KEY` repo secret. See the setup runbook:
#     .github/github-app-ci-reader.md. The sweep is a no-op until the App is
#     provisioned (gated on the DVT_SCHEMA_APP_ID variable).
#
# Why a GitHub App, not a PAT: the installation token is short-lived (auto-rotated
# per run), scoped to exactly getdvt/dvt Contents:read, and owned by the org —
# not tied to any one person's account. The pattern generalizes to any cross-repo
# CI read; the runbook documents how to reuse it.
#
# Do NOT add `upstream-enum-sweep` to branch-protection required checks: it does
# not run on PRs (job-level event guard) and skips when the App is unprovisioned,
# so it would report a false green. The PR-time gate is the `drift` job only.
#
# The two enum/page guards (check-chart-types.mjs, check-chart-pages.mjs) stay
# dependency-free and run first. The snippet-schema guard (check-chart-specs.mjs)
# needs ajv, hence the `npm ci` step before it, ordered after the two
# zero-dependency checks so a dependency-install failure cannot mask them.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/charts.ts'
      - 'src/data/panel-types.json'
      - 'src/data/chart-pages.json'
      - 'src/data/chart-page-extras.ts'
      - 'src/data/dashboard.schema.json'
      - 'scripts/check-chart-types.mjs'
      - 'scripts/check-chart-pages.mjs'
      - 'scripts/check-chart-specs.mjs'
      # A change here changes what the vendored schema IS, and what the weekly
      # sweep compares against — so it must re-run the gates.
      - 'scripts/normalize-schema.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chart-types-drift.yml'
  schedule:
    - cron: '23 13 * * 1'   # Mondays 13:23 UTC — weekly upstream-drift sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: chart-types-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assert all dvtType values are valid PanelType members
        run: node scripts/check-chart-types.mjs

      - name: Assert chart-pages.json covers every page-worthy PanelType member
        run: node scripts/check-chart-pages.mjs

      - name: npm ci
        run: npm ci

      - name: Assert every chart-catalog snippet validates against dvt's Panel schema (structure only — not data-binding or ECharts keys)
        run: node scripts/check-chart-specs.mjs

  upstream-sweep:
    name: upstream-enum-sweep
    # Schedule / manual only — never on PRs (avoids a false-green required-check
    # trap and wasted runner minutes; the PR gate is the `drift` job).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Loud skip when the App isn't provisioned yet — App ID lives in a repo
      # VARIABLE (not a secret) so it can gate `if:` (secrets can't be used there).
      - name: Notice if the getdvt-ci-reader App is not configured
        if: vars.DVT_SCHEMA_APP_ID == ''
        run: |
          echo "::notice::Upstream sweep skipped: the getdvt-ci-reader GitHub App is not configured. Set the DVT_SCHEMA_APP_ID repo variable + DVT_SCHEMA_APP_PRIVATE_KEY repo secret to enable the weekly upstream drift check. See .github/github-app-ci-reader.md."

      # Mint a short-lived installation token scoped to getdvt/dvt Contents:read.
      # The App is installed on getdvt/dvt; owner+repositories scope the token to it.
      - name: Mint getdvt/dvt read token (GitHub App)
        id: app-token
        if: vars.DVT_SCHEMA_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DVT_SCHEMA_APP_ID }}
          private-key: ${{ secrets.DVT_SCHEMA_APP_PRIVATE_KEY }}
          owner: getdvt
          repositories: dvt

      - uses: actions/checkout@v4
        if: vars.DVT_SCHEMA_APP_ID != ''

      - uses: actions/setup-node@v4
        if: vars.DVT_SCHEMA_APP_ID != ''
        with:
          node-version: 22

      - name: Compare upstream PanelType enum to vendored copy
        if: vars.DVT_SCHEMA_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Fetch upstream schema from origin/main.
          gh api repos/getdvt/dvt/contents/spec/schema/dashboard.schema.json \
            -H "Accept: application/vnd.github.raw" > /tmp/upstream-schema.json

          # Guard: result must be valid JSON with a non-empty $defs.PanelType.enum.
          node -e '
          const fs = require("fs");
          try {
            const schema = JSON.parse(fs.readFileSync("/tmp/upstream-schema.json", "utf8"));
            const arr = (schema["$defs"] || {})["PanelType"] && schema["$defs"]["PanelType"]["enum"];
            if (!Array.isArray(arr) || arr.length === 0) {
              console.error("::error::Upstream schema fetch returned invalid JSON or missing $defs.PanelType.enum. Cannot verify drift.");
              process.exit(1);
            }
            console.log("Upstream schema valid: " + arr.length + " PanelType members.");
          } catch (e) {
            console.error("::error::Failed to parse upstream schema: " + e.message);
            process.exit(1);
          }
          '

          # Compare upstream enum to vendored copy AS SETS (order-independent).
          node -e '
          const fs = require("fs");
          const upstream = JSON.parse(fs.readFileSync("/tmp/upstream-schema.json", "utf8"))["$defs"]["PanelType"]["enum"];
          const vendored = JSON.parse(fs.readFileSync("src/data/panel-types.json", "utf8")).panelTypes;
          const upSet = new Set(upstream);
          const venSet = new Set(vendored);
          const added   = upstream.filter(t => !venSet.has(t));
          const removed = vendored.filter(t => !upSet.has(t));
          if (added.length || removed.length) {
            console.error("::error::Upstream PanelType enum has drifted from the vendored copy in src/data/panel-types.json.");
            if (added.length)   console.error("  Added upstream (missing from vendored):  " + JSON.stringify(added));
            if (removed.length) console.error("  Removed upstream (still in vendored):    " + JSON.stringify(removed));
            console.error("Fix: run ./scripts/sync-panel-types.sh and commit src/data/panel-types.json.");
            process.exit(1);
          }
          console.log("OK — upstream enum matches vendored copy (" + vendored.length + " types).");
          '

      # HIGH-1: the enum compare above only covers $defs.PanelType.enum. The
      # snippet gate validates against the WHOLE vendored schema, so a change to
      # $defs/Panel or $defs/TableSpec upstream would leave both jobs green while
      # the snippet gate silently checks a stale contract — and the two `table`
      # bugs that motivated that gate were TableSpec violations, not enum ones.
      # Byte-compare is valid by construction: sync-panel-types.sh copies the
      # schema verbatim (`cp`), so any difference is real drift.
      - name: Compare full upstream schema to vendored copy (byte-exact)
        if: vars.DVT_SCHEMA_APP_ID != ''
        run: |
          # `cmp -s` also exits non-zero when a file is MISSING, which would report
          # a deleted vendored copy as "drift". Check existence first so the error
          # names the real cause.
          if [[ ! -f src/data/dashboard.schema.json ]]; then
            echo "::error::Vendored src/data/dashboard.schema.json is missing. Fix: run ./scripts/sync-panel-types.sh and commit both vendored artifacts."
            exit 1
          fi
          # Normalize the upstream fetch with the SAME script that produced the
          # vendored copy, then compare normalized-to-normalized. The vendored copy
          # is structure-only (this repo is public; upstream's annotation prose is
          # internal commentary), so a raw compare would report permanent drift.
          node scripts/normalize-schema.mjs /tmp/upstream-schema.json > /tmp/upstream-normalized.json

          if ! cmp -s /tmp/upstream-normalized.json src/data/dashboard.schema.json; then
            echo "::error::Upstream spec/schema/dashboard.schema.json has drifted STRUCTURALLY from the vendored copy in src/data/dashboard.schema.json. (Annotation-prose-only upstream edits are normalized away and will NOT trigger this.) Fix: run ./scripts/sync-panel-types.sh and commit both vendored artifacts."
            # Diff the WHOLE files — `head -50` already bounds the log. Truncating the
            # inputs instead would print an empty diff for drift past the truncation
            # point, i.e. "it drifted" with no evidence of where.
            diff src/data/dashboard.schema.json /tmp/upstream-normalized.json | head -50 || true
            exit 1
          fi
          echo "OK — vendored dashboard.schema.json is byte-identical to upstream."
