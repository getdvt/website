name: Chart-type drift check

# Every dvtType string in src/data/charts.ts must resolve to a member of dvt's
# canonical PanelType enum, which is VENDORED into src/data/panel-types.json.
#
# The enum is vendored because getdvt/dvt is private and CI has no token to read
# it live. The vendored copy is refreshed locally via scripts/sync-panel-types.sh
# (which now defaults to gh api / origin/main — no sibling checkout required),
# then committed.
#
# Coverage split (mirrors spec-skill-drift.yml):
#   - PR trigger catches a hand-edit of charts.ts that introduces a typo or an
#     invented dvtType, and catches a stale panel-types.json after a manual refresh
#     that wasn't committed.
#   - UPSTREAM drift (a silent rename in getdvt/dvt while both local files sit
#     unchanged) is caught by the weekly `schedule:` sweep in the `upstream-sweep`
#     job below. That job mints a short-lived GitHub App installation token and
#     reads origin/main's schema live via `gh api`, then checks it TWICE: a
#     set-compare of $defs.PanelType.enum against panel-types.json, and a
#     byte-compare of the whole file against the vendored dashboard.schema.json,
#     after normalizing the upstream fetch with the same scripts/normalize-schema.mjs
#     the vendored copy was produced by (this repo is public; upstream annotation
#     prose is stripped, so a raw compare would report permanent false drift).
#     The second is what keeps the snippet gate honest — it validates against the
#     WHOLE schema, so a change to $defs/Panel or $defs/TableSpec (the class of
#     change that motivated the gate) would otherwise leave every job green while
#     the gate silently checked a stale contract. Auth = the `getdvt-ci-reader`
#     App (Contents: read on getdvt/dvt), wired as the `DVT_SCHEMA_APP_ID` repo
#     variable + `DVT_SCHEMA_APP_PRIVATE_KEY` repo secret. See the setup runbook:
#     .github/github-app-ci-reader.md. Both are provisioned (App ID 4149101, set
#     2026-06-26) and the sweep is LIVE — a red sweep here is real drift, not an
#     unwired gate.
#
# Why a GitHub App, not a PAT: the installation token is short-lived (auto-rotated
# per run), scoped to exactly getdvt/dvt Contents:read, and owned by the org —
# not tied to any one person's account. The pattern generalizes to any cross-repo
# CI read; the runbook documents how to reuse it.
#
# Do NOT add `upstream-enum-sweep` to branch-protection required checks: it does
# not run on PRs (job-level event guard), so it could never satisfy a PR-time
# required check. The PR-time gate is the `drift` job only. (An unwired App no
# longer skips quietly — the scheduled run now fails loudly instead; see the
# first step of the `upstream-sweep` job below.)
#
# The two enum/page guards (check-chart-types.mjs, check-chart-pages.mjs) stay
# dependency-free and run first. The snippet-schema guard (check-chart-specs.mjs)
# needs ajv, hence the `npm ci` step before it, ordered after the two
# zero-dependency checks so a dependency-install failure cannot mask them.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/charts.ts'
      - 'src/data/panel-types.json'
      - 'src/data/chart-pages.json'
      - 'src/data/chart-page-extras.ts'
      - 'src/data/dashboard.schema.json'
      - 'src/data/chart-type-status.json'
      - 'scripts/check-chart-types.mjs'
      - 'scripts/check-chart-pages.mjs'
      - 'scripts/check-chart-specs.mjs'
      # A change here changes what the vendored schema IS, and what the weekly
      # sweep compares against — so it must re-run the gates.
      - 'scripts/normalize-schema.mjs'
      - 'scripts/normalize-schema.test.mjs'
      - 'scripts/project-chart-type-status.mjs'
      - 'scripts/project-chart-type-status.test.mjs'
      - 'scripts/sync-panel-types.sh'
      # check-chart-types.mjs asserts the README's provenance block matches the
      # vendored schema — so a README-only edit must re-run the gates too.
      - 'src/data/README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chart-types-drift.yml'
  schedule:
    - cron: '23 13 * * 1'   # Mondays 13:23 UTC — weekly upstream-drift sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: chart-types-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assert all dvtType values are valid PanelType members
        run: node scripts/check-chart-types.mjs

      - name: Assert chart-pages.json covers every page-worthy PanelType member
        run: node scripts/check-chart-pages.mjs

      # Self-test the normalizer itself before trusting it in the fixed-point
      # check below: covers the opaque-value tripwire (STRIP-key-inside-enum
      # must refuse to normalize) and the schema-aware strip (a real property
      # named "description" must survive). Zero-dep, so it runs before `npm ci`.
      - name: Normalizer self-test (tripwire + schema-aware strip)
        run: node scripts/normalize-schema.test.mjs

      # Same self-test discipline as the normalizer above, for the
      # chart-type-status whitelist projection (DVT-3113): covers the
      # prose-scrubbing whitelist behavior, the closed-enum refusal, and
      # determinism. Zero-dep, so it also runs before `npm ci`.
      - name: Chart-type-status projector self-test (whitelist + closed enum)
        run: node scripts/project-chart-type-status.test.mjs

      # The vendored schema must be a FIXED POINT of the normalizer. This is the
      # PR-time half of the drift story and it needs no token and no network: it
      # catches a PR that edits scripts/normalize-schema.mjs (or hand-edits the
      # vendored file) and forgets to re-run ./scripts/sync-panel-types.sh, which
      # would otherwise stay green until the Monday sweep. Zero-dep, so it runs
      # before `npm ci` alongside the other two.
      - name: Assert the vendored schema is a fixed point of the normalizer
        run: |
          if ! node scripts/normalize-schema.mjs src/data/dashboard.schema.json \
               | cmp -s - src/data/dashboard.schema.json; then
            echo "::error::src/data/dashboard.schema.json is not a fixed point of scripts/normalize-schema.mjs — the vendored copy and the normalizer disagree. Fix: run ./scripts/sync-panel-types.sh and commit both vendored artifacts."
            exit 1
          fi
          echo "OK — vendored schema is a fixed point of the normalizer."

      - name: npm ci
        run: npm ci

      - name: Assert every chart-catalog snippet validates against dvt's Panel schema and the data-binding contract
        run: node scripts/check-chart-specs.mjs

  upstream-sweep:
    name: upstream-enum-sweep
    # Schedule / manual only — never on PRs (avoids a false-green required-check
    # trap and wasted runner minutes; the PR gate is the `drift` job).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Hard-fail (not skip) when the App isn't provisioned — App ID lives in a
      # repo VARIABLE (not a secret) so it can gate `if:` (secrets can't be used
      # there). The header above asserts the sweep is LIVE, so a green run of
      # this job must mean it actually ran; silently skipping would report a
      # false green.
      - name: Fail if the getdvt-ci-reader App is unwired
        if: vars.DVT_SCHEMA_APP_ID == ''
        run: |
          echo "::error::The sweep is asserted live/provisioned in this file's header, but the DVT_SCHEMA_APP_ID repo variable is missing, so the drift contract is unwired. Restore the variable + DVT_SCHEMA_APP_PRIVATE_KEY, or consciously downgrade this file's claims. See .github/github-app-ci-reader.md."
          exit 1

      # Mint a short-lived installation token scoped to getdvt/dvt Contents:read.
      # The App is installed on getdvt/dvt; owner+repositories scope the token to it.
      - name: Mint getdvt/dvt read token (GitHub App)
        id: app-token
        if: vars.DVT_SCHEMA_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DVT_SCHEMA_APP_ID }}
          private-key: ${{ secrets.DVT_SCHEMA_APP_PRIVATE_KEY }}
          owner: getdvt
          repositories: dvt

      - uses: actions/checkout@v4
        if: vars.DVT_SCHEMA_APP_ID != ''

      - uses: actions/setup-node@v4
        if: vars.DVT_SCHEMA_APP_ID != ''
        with:
          node-version: 22

      - name: Compare upstream PanelType enum to vendored copy
        if: vars.DVT_SCHEMA_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Fetch upstream schema from origin/main.
          gh api repos/getdvt/dvt/contents/spec/schema/dashboard.schema.json \
            -H "Accept: application/vnd.github.raw" > /tmp/upstream-schema.json

          # Guard: result must be valid JSON with a non-empty $defs.PanelType.enum.
          node -e '
          const fs = require("fs");
          try {
            const schema = JSON.parse(fs.readFileSync("/tmp/upstream-schema.json", "utf8"));
            const arr = (schema["$defs"] || {})["PanelType"] && schema["$defs"]["PanelType"]["enum"];
            if (!Array.isArray(arr) || arr.length === 0) {
              console.error("::error::Upstream schema fetch returned invalid JSON or missing $defs.PanelType.enum. Cannot verify drift.");
              process.exit(1);
            }
            console.log("Upstream schema valid: " + arr.length + " PanelType members.");
          } catch (e) {
            console.error("::error::Failed to parse upstream schema: " + e.message);
            process.exit(1);
          }
          '

          # Compare upstream enum to vendored copy AS SETS (order-independent).
          node -e '
          const fs = require("fs");
          const upstream = JSON.parse(fs.readFileSync("/tmp/upstream-schema.json", "utf8"))["$defs"]["PanelType"]["enum"];
          const vendored = JSON.parse(fs.readFileSync("src/data/panel-types.json", "utf8")).panelTypes;
          const upSet = new Set(upstream);
          const venSet = new Set(vendored);
          const added   = upstream.filter(t => !venSet.has(t));
          const removed = vendored.filter(t => !upSet.has(t));
          if (added.length || removed.length) {
            console.error("::error::Upstream PanelType enum has drifted from the vendored copy in src/data/panel-types.json.");
            if (added.length)   console.error("  Added upstream (missing from vendored):  " + JSON.stringify(added));
            if (removed.length) console.error("  Removed upstream (still in vendored):    " + JSON.stringify(removed));
            console.error("Fix: run ./scripts/sync-panel-types.sh and commit src/data/panel-types.json.");
            process.exit(1);
          }
          console.log("OK — upstream enum matches vendored copy (" + vendored.length + " types).");
          '

      # HIGH-1: the enum compare above only covers $defs.PanelType.enum. The
      # snippet gate validates against the WHOLE vendored schema, so a change to
      # $defs/Panel or $defs/TableSpec upstream would leave both jobs green while
      # the snippet gate silently checks a stale contract — and the two `table`
      # bugs that motivated that gate were TableSpec violations, not enum ones.
      # Validity of the compare: sync-panel-types.sh produces the vendored file by
      # running the SAME scripts/normalize-schema.mjs over the same upstream bytes,
      # so any difference in the NORMALIZED forms is real STRUCTURAL drift. Note the
      # compare is asymmetric on purpose — only the upstream side is normalized here;
      # the vendored file is compared as committed, so a local hand-edit to it
      # (including adding annotation prose back) still goes red.
      - name: Compare full upstream schema to vendored copy (structural, normalized)
        if: vars.DVT_SCHEMA_APP_ID != ''
        run: |
          # `cmp -s` also exits non-zero when a file is MISSING, which would report
          # a deleted vendored copy as "drift". Check existence first so the error
          # names the real cause.
          if [[ ! -f src/data/dashboard.schema.json ]]; then
            echo "::error::Vendored src/data/dashboard.schema.json is missing. Fix: run ./scripts/sync-panel-types.sh and commit both vendored artifacts."
            exit 1
          fi
          # Normalize the upstream fetch with the SAME script that produced the
          # vendored copy, then compare normalized-to-normalized. The vendored copy
          # is structure-only (this repo is public; upstream's annotation prose is
          # internal commentary), so a raw compare would report permanent drift.
          node scripts/normalize-schema.mjs /tmp/upstream-schema.json > /tmp/upstream-normalized.json

          if ! cmp -s /tmp/upstream-normalized.json src/data/dashboard.schema.json; then
            echo "::error::Upstream spec/schema/dashboard.schema.json has drifted STRUCTURALLY from the vendored copy in src/data/dashboard.schema.json. (Annotation-prose-only upstream edits are normalized away and will NOT trigger this.) Fix: run ./scripts/sync-panel-types.sh and commit both vendored artifacts."
            # Diff the WHOLE files — `head -50` already bounds the log. Truncating the
            # inputs instead would print an empty diff for drift past the truncation
            # point, i.e. "it drifted" with no evidence of where.
            diff src/data/dashboard.schema.json /tmp/upstream-normalized.json | head -50 || true
            exit 1
          fi
          echo "OK — vendored dashboard.schema.json matches upstream structurally (normalized compare)."

      # DVT-3113: mirror the schema compare above for the THIRD vendored
      # artifact — src/data/chart-type-status.json, a whitelist PROJECTION of
      # spec/schema/echarts/chart-types.json (type -> status only; see
      # scripts/project-chart-type-status.mjs). Same asymmetric-compare model
      # as the schema: only the upstream side is projected here; the vendored
      # file is compared as committed, so a local hand-edit to it still goes
      # red. A projection REFUSAL (an unrecognized new upstream status value)
      # must fail this job loudly, not silently skip the compare.
      - name: Compare upstream chart-type status table to vendored copy (projected)
        if: vars.DVT_SCHEMA_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/getdvt/dvt/contents/spec/schema/echarts/chart-types.json \
            -H "Accept: application/vnd.github.raw" > /tmp/upstream-chart-types.json

          # Guard: result must be valid JSON with a non-empty top-level "types" object.
          node -e '
          const fs = require("fs");
          try {
            const ct = JSON.parse(fs.readFileSync("/tmp/upstream-chart-types.json", "utf8"));
            const types = ct && ct.types;
            if (!types || typeof types !== "object" || Array.isArray(types) || Object.keys(types).length === 0) {
              console.error("::error::Upstream chart-types.json fetch returned invalid JSON or missing a non-empty top-level \"types\" object. Cannot verify drift.");
              process.exit(1);
            }
            console.log("Upstream chart-types.json valid: " + Object.keys(types).length + " types.");
          } catch (e) {
            console.error("::error::Failed to parse upstream chart-types.json: " + e.message);
            process.exit(1);
          }
          '

          if [[ ! -f src/data/chart-type-status.json ]]; then
            echo "::error::Vendored src/data/chart-type-status.json is missing. Fix: run ./scripts/sync-panel-types.sh and commit the result."
            exit 1
          fi

          # Project the live upstream fetch with the SAME script that produced the
          # vendored copy. A projection refusal here (e.g. an unrecognized new
          # upstream status value) exits non-zero and fails this job loudly — it
          # must be audited by a human before being vendored, not silently skipped.
          if ! node scripts/project-chart-type-status.mjs /tmp/upstream-chart-types.json > /tmp/upstream-status-projected.json; then
            echo "::error::Failed to project the live upstream chart-types.json — see the error above (likely an unrecognized status value that needs human audit before vendoring)."
            exit 1
          fi

          if ! cmp -s /tmp/upstream-status-projected.json src/data/chart-type-status.json; then
            echo "::error::Upstream spec/schema/echarts/chart-types.json has drifted from the vendored projection in src/data/chart-type-status.json. Fix: run ./scripts/sync-panel-types.sh and commit the result."
            diff src/data/chart-type-status.json /tmp/upstream-status-projected.json | head -50 || true
            exit 1
          fi
          echo "OK — vendored chart-type-status.json matches upstream (projected compare)."
